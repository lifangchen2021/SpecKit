[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "speckit"
version = "0.2.0"
description = "SpecKit: neutron spectrum unfolding using activation reactions, extended with bssunfold methods"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "bssunfold[windows]>=0.28",
    "openpyxl>=3.1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
py-modules = []
